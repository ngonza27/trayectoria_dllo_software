<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Iniciar sesión — Fresh Fork Restaurant Group</title>
  <script src="/analytics.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 380px; margin: 80px auto; }
    label { display: block; margin-top: 12px; font-size: 14px; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 20px; padding: 10px 16px; width: 100%; }
    #error { color: #b00020; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Fresh Fork — Reservas de mesa</h1>
  <form id="login-form">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username" />

    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password" />

    <button type="submit">Ingresar</button>
    <p id="error" hidden></p>
  </form>
  <p>¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>

  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const errorEl = document.getElementById("error");
      errorEl.hidden = true;

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const response = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      if (!response.ok) {
        errorEl.textContent =
          response.status === 429
            ? "Demasiados intentos. Intenta de nuevo en unos segundos."
            : "Credenciales inválidas.";
        errorEl.hidden = false;
        return;
      }

      const data = await response.json();
      localStorage.setItem("access_token", data.access_token);
      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
