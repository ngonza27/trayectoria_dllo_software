<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Dashboard — Cuentas API</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; }
    form.inline { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    form.inline input { padding: 6px; }
    button { cursor: pointer; }
    #error { color: #b00020; }
    .top-bar { display: flex; justify-content: space-between; align-items: baseline; }
  </style>
</head>
<body id="dashboard" hidden>
  <div class="top-bar">
    <h1>Cuentas</h1>
    <div>
      <span id="whoami"></span> ·
      <a href="#" id="logout">Salir</a>
    </div>
  </div>

  <p id="error" hidden></p>

  <table>
    <thead>
      <tr><th>ID</th><th>Titular</th><th>Número de cuenta</th><th>Saldo</th><th></th></tr>
    </thead>
    <tbody id="cuentas-body"></tbody>
  </table>

  <h2>Nueva cuenta</h2>
  <form class="inline" id="crear-form">
    <input id="titular" placeholder="Titular" required />
    <input id="numero_cuenta" placeholder="Número de cuenta (8-20 dígitos)" required minlength="8" maxlength="20" />
    <input id="saldo" type="number" step="0.01" placeholder="Saldo" value="0" />
    <button type="submit">Crear</button>
  </form>

  <script>
    const token = localStorage.getItem("access_token");
    if (!token) {
      window.location.href = "/login.html";
    }

    function authHeaders() {
      return { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };
    }

    function showError(message) {
      const el = document.getElementById("error");
      el.textContent = message;
      el.hidden = false;
    }

    async function cargarPerfil() {
      const response = await fetch("/auth/me", { headers: authHeaders() });
      if (response.status === 401) {
        localStorage.removeItem("access_token");
        window.location.href = "/login.html";
        return null;
      }
      return response.json();
    }

    async function cargarCuentas() {
      const response = await fetch("/cuentas", { headers: authHeaders() });
      if (!response.ok) {
        showError("No se pudieron cargar las cuentas.");
        return;
      }
      const cuentas = await response.json();
      const body = document.getElementById("cuentas-body");
      body.innerHTML = "";
      for (const cuenta of cuentas) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${cuenta.id}</td>
          <td>${cuenta.titular}</td>
          <td>${cuenta.numero_cuenta}</td>
          <td>${cuenta.saldo}</td>
          <td><button data-id="${cuenta.id}" class="borrar">Borrar</button></td>
        `;
        body.appendChild(tr);
      }
      document.querySelectorAll(".borrar").forEach((btn) => {
        btn.addEventListener("click", () => borrarCuenta(btn.dataset.id));
      });
    }

    async function borrarCuenta(id) {
      const response = await fetch(`/cuentas/${id}`, { method: "DELETE", headers: authHeaders() });
      if (response.status === 403) {
        showError("Solo un admin puede borrar cuentas.");
        return;
      }
      await cargarCuentas();
    }

    document.getElementById("crear-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {
        titular: document.getElementById("titular").value,
        numero_cuenta: document.getElementById("numero_cuenta").value,
        saldo: parseFloat(document.getElementById("saldo").value || "0"),
      };
      const response = await fetch("/cuentas", { method: "POST", headers: authHeaders(), body: JSON.stringify(body) });
      if (!response.ok) {
        showError("No se pudo crear la cuenta.");
        return;
      }
      event.target.reset();
      await cargarCuentas();
    });

    document.getElementById("logout").addEventListener("click", (event) => {
      event.preventDefault();
      localStorage.removeItem("access_token");
      window.location.href = "/login.html";
    });

    (async () => {
      const perfil = await cargarPerfil();
      if (!perfil) return;
      document.getElementById("whoami").textContent = `${perfil.email} (${perfil.rol})`;
      document.getElementById("dashboard").hidden = false;
      await cargarCuentas();
    })();
  </script>
</body>
</html>
